openapi: 3.1.0
info:
  title: Subscription Tracking System API
  version: 0.4.0
  description: |
    Sprint 1 contract draft for the subscription-only first release.
    This document describes planned behavior; an API server is not delivered here.

    Authentication uses a documented local Bearer-token stub. The authenticated
    user's identity comes from the token, never from a request body or query.
    Every subscription operation is scoped to that user. A missing resource and
    another user's resource both return 404.

    Subscriptions retain their original TRY, USD, or EUR price. The dashboard's
    baseCurrency query selects the display currency independently of the token.
    Only ACTIVE subscriptions contribute to the monthly equivalent. MONTHLY
    prices count once; YEARLY prices are divided by 12 before conversion with
    fixed mock exchange rates. Sum without intermediate rounding, then round
    the final total to two decimal places using round-half-up.

    Accept-Language supports tr-TR and en-US, defaulting to en-US when omitted.
    Error title and detail are localized; machine-readable code is stable.
    DELETE permanently removes a subscription. PATCH status=CANCELLED keeps it.
servers:
  - url: http://localhost:8000
    description: Planned local API address; no running service is implied
tags:
  - name: Subscriptions
    description: User-owned subscription lifecycle
  - name: Dashboard
    description: Consolidated monthly equivalents using mock exchange rates
security:
  - BearerAuth: []
paths:
  /subscriptions:
    parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
    get:
      tags: [Subscriptions]
      operationId: listSubscriptions
      summary: List the authenticated user's subscriptions
      parameters:
        - name: status
          in: query
          required: false
          description: Omit to return all statuses; an unknown value returns 400.
          schema:
            $ref: '#/components/schemas/SubscriptionStatus'
          example: ACTIVE
      responses:
        '200':
          description: Matching subscriptions; an empty result is an empty array
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subscription'
              examples:
                populated:
                  value:
                    - id: SUB-8091
                      name: Netflix
                      price: 15.99
                      currency: USD
                      billingCycle: MONTHLY
                      renewalDate: '2026-11-01T09:00:00Z'
                      status: ACTIVE
                empty:
                  value: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Subscriptions]
      operationId: createSubscription
      summary: Add a subscription in its original currency
      description: |
        Creates an ACTIVE subscription. A name already used by this user returns
        409. Other users may use the same name. TRY, USD, and EUR are accepted
        regardless of the user's dashboard base currency.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewSubscription'
            examples:
              monthlyUsd:
                value:
                  name: Netflix
                  price: 15.99
                  currency: USD
                  billingCycle: MONTHLY
                  renewalDate: '2026-11-01T09:00:00Z'
              yearlyTry:
                value:
                  name: Annual Cloud Plan
                  price: 1200
                  currency: TRY
                  billingCycle: YEARLY
                  renewalDate: '2027-01-15T09:00:00Z'
      responses:
        '201':
          description: Subscription created with status ACTIVE
          headers:
            Location:
              description: Relative URL of the new subscription
              schema:
                type: string
              example: /subscriptions/SUB-8091
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
              examples:
                created:
                  $ref: '#/components/examples/ActiveSubscription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/DuplicateName'
  /subscriptions/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - $ref: '#/components/parameters/AcceptLanguage'
    get:
      tags: [Subscriptions]
      operationId: getSubscription
      summary: Get a subscription owned by the authenticated user
      responses:
        '200':
          description: The requested subscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
              examples:
                subscription:
                  $ref: '#/components/examples/ActiveSubscription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Subscriptions]
      operationId: updateSubscription
      summary: Update selected subscription fields or its status
      description: |
        At least one supported field is required. Omitted fields keep their
        current values; null does not clear a field. Price and billingCycle
        changes affect subsequent dashboard calculations. Setting CANCELLED
        preserves the record but excludes it from the monthly equivalent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubscription'
            examples:
              pause:
                value:
                  status: PAUSED
              changePrice:
                value:
                  price: 17.99
                  currency: USD
      responses:
        '200':
          description: Updated subscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
              examples:
                paused:
                  value:
                    id: SUB-8091
                    name: Netflix
                    price: 15.99
                    currency: USD
                    billingCycle: MONTHLY
                    renewalDate: '2026-11-01T09:00:00Z'
                    status: PAUSED
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DuplicateName'
    delete:
      tags: [Subscriptions]
      operationId: deleteSubscription
      summary: Permanently delete an owned subscription
      description: |
        Returns no response body on success. Deleting a missing or foreign
        resource returns 404. The next dashboard query reflects the deletion.
      responses:
        '204':
          description: Deleted successfully; no response body
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /dashboard/summary:
    parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
    get:
      tags: [Dashboard]
      operationId: getDashboardSummary
      summary: Get the monthly equivalent in a selected base currency
      description: |
        This is a normalized monthly commitment, not cash charged in a calendar
        month. Include only this user's ACTIVE subscriptions. A yearly price is
        divided by 12 even when its renewal occurs in another month. With no
        active subscriptions, return a zero total and zero active count.
      parameters:
        - name: baseCurrency
          in: query
          required: false
          description: Defaults to TRY. Unsupported values return 400.
          schema:
            $ref: '#/components/schemas/BaseCurrency'
          example: TRY
      responses:
        '200':
          description: Consolidated monthly equivalent using fixed mock rates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
              examples:
                mixedCurrencies:
                  summary: USD 15.99 monthly plus TRY 1200 yearly at mock USD/TRY 35
                  value:
                    totalMonthlyExpense: 659.65
                    baseCurrency: TRY
                    activeSubscriptionsCount: 2
                empty:
                  value:
                    totalMonthlyExpense: 0
                    baseCurrency: TRY
                    activeSubscriptionsCount: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Planned local authentication stub with a verified sub claim. Real
        identity-provider implementation is deferred. Never accept a user ID
        from client-supplied resource fields as authentication.
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: Opaque subscription identifier
      schema:
        type: string
        minLength: 1
      example: SUB-8091
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: |
        Supported locale for error messages. Omitted means en-US. In this draft,
        only these two exact values are supported; an unsupported value returns
        400 with the default English error message.
      schema:
        type: string
        enum: [tr-TR, en-US]
        default: en-US
      example: tr-TR
  schemas:
    Currency:
      type: string
      enum: [TRY, USD, EUR]
      description: Original subscription currency; independent of display currency
      examples: [USD]
    BaseCurrency:
      type: string
      enum: [TRY, USD, EUR]
      default: TRY
      description: Currency in which the dashboard total is displayed
    BillingCycle:
      type: string
      enum: [MONTHLY, YEARLY]
    SubscriptionStatus:
      type: string
      enum: [ACTIVE, PAUSED, CANCELLED]
    SubscriptionName:
      type: string
      minLength: 1
      pattern: '\S'
      description: Nonblank service name; must be unique for the authenticated user
      examples: [Netflix]
    Price:
      type: number
      minimum: 0
      description: Nonnegative price in the original currency, never a formatted string
      examples: [15.99, 0]
    RenewalDate:
      type: string
      format: date-time
      description: Renewal timestamp with an explicit UTC offset
      examples: ['2026-11-01T09:00:00Z']
    NewSubscription:
      type: object
      additionalProperties: false
      required: [name, price, currency, billingCycle, renewalDate]
      properties:
        name:
          $ref: '#/components/schemas/SubscriptionName'
        price:
          $ref: '#/components/schemas/Price'
        currency:
          $ref: '#/components/schemas/Currency'
        billingCycle:
          $ref: '#/components/schemas/BillingCycle'
        renewalDate:
          $ref: '#/components/schemas/RenewalDate'
    UpdateSubscription:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          $ref: '#/components/schemas/SubscriptionName'
        price:
          $ref: '#/components/schemas/Price'
        currency:
          $ref: '#/components/schemas/Currency'
        billingCycle:
          $ref: '#/components/schemas/BillingCycle'
        renewalDate:
          $ref: '#/components/schemas/RenewalDate'
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
    Subscription:
      type: object
      additionalProperties: false
      required: [id, name, price, currency, billingCycle, renewalDate, status]
      properties:
        id:
          type: string
          minLength: 1
        name:
          $ref: '#/components/schemas/SubscriptionName'
        price:
          $ref: '#/components/schemas/Price'
        currency:
          $ref: '#/components/schemas/Currency'
        billingCycle:
          $ref: '#/components/schemas/BillingCycle'
        renewalDate:
          $ref: '#/components/schemas/RenewalDate'
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
    DashboardSummary:
      type: object
      additionalProperties: false
      required: [totalMonthlyExpense, baseCurrency, activeSubscriptionsCount]
      properties:
        totalMonthlyExpense:
          type: number
          minimum: 0
          description: Final monthly equivalent rounded to two decimal places
        baseCurrency:
          $ref: '#/components/schemas/Currency'
        activeSubscriptionsCount:
          type: integer
          minimum: 0
    Problem:
      type: object
      description: RFC 9457 problem details with a stable application error code
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          description: Problem type URI; about:blank for general HTTP errors
        title:
          type: string
          minLength: 1
        status:
          type: integer
          enum: [400, 401, 404, 409]
        code:
          type: string
          minLength: 1
          description: Stable identifier, independent of the chosen locale
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
  examples:
    ActiveSubscription:
      value:
        id: SUB-8091
        name: Netflix
        price: 15.99
        currency: USD
        billingCycle: MONTHLY
        renewalDate: '2026-11-01T09:00:00Z'
        status: ACTIVE
  responses:
    BadRequest:
      description: Invalid body, filter, base currency, or locale
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalidInputEnglish:
              value:
                type: about:blank
                title: Bad Request
                status: 400
                code: INVALID_INPUT
                detail: Price must be a nonnegative number.
            invalidInputTurkish:
              value:
                type: about:blank
                title: Geçersiz İstek
                status: 400
                code: INVALID_INPUT
                detail: Fiyat sıfır veya pozitif bir sayı olmalıdır.
            invalidCurrency:
              value:
                type: about:blank
                title: Bad Request
                status: 400
                code: INVALID_CURRENCY
                detail: Supported currencies are TRY, USD, and EUR.
    Unauthorized:
      description: Missing or invalid Bearer token
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        WWW-Authenticate:
          description: Bearer authentication challenge
          schema:
            type: string
          example: Bearer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unauthorized:
              value:
                type: about:blank
                title: Unauthorized
                status: 401
                code: UNAUTHORIZED
                detail: A valid Bearer token is required.
    NotFound:
      description: Subscription does not exist or belongs to another user
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notFound:
              value:
                type: about:blank
                title: Not Found
                status: 404
                code: SUBSCRIPTION_NOT_FOUND
                detail: The requested subscription was not found.
    DuplicateName:
      description: This user already has a subscription with the same name
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            duplicateName:
              value:
                type: about:blank
                title: Conflict
                status: 409
                code: DUPLICATE_SUBSCRIPTION
                detail: A subscription with this name already exists for this user.
  headers:
    ContentLanguage:
      description: Language used for the localized error title and detail
      schema:
        type: string
        enum: [tr-TR, en-US]
      example: en-US
