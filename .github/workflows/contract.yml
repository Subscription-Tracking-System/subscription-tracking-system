name: Contract CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-contract:
    name: Validate OpenAPI and contract acceptance cases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the proposed contract
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install locked validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check the contract and all examples
        run: python scripts/validate_contract.py --report artifacts/contract-validation.json
      - name: Run contract acceptance cases
        run: python -m unittest discover -s tests -v
